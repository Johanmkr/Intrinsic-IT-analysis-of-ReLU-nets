# Continuous integration. See README.md, "Tests and CI".
#
#   unit-tests  every push / PR   fast tests (no checkpoints needed; checkpoint tests skip)
#   figures     every push / PR   step 5 from the committed results; results/summary/ must not change
#   smoke       main + manual     whole pipeline on the tiny smoke sweep, then the tests on it
#   docker      main + manual     build the image, step 5 inside it without network
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # rebuttal group: infomeasure, for the estimator cross-check in tests/test_estimators.py
      - run: uv sync --frozen --group rebuttal
      - run: uv run pytest tests -q -rs

  figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: ./run.sh step5
      - name: results/summary/ is reproduced from results/
        run: git diff --exit-code -- results/summary
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: figures/

  smoke:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Cache MNIST and WBC
        uses: actions/cache@v6
        with:
          path: data
          key: datasets-v1
      - run: ./run.sh setup
      - run: ./run.sh smoke --workers 4
      - run: ./run.sh test -q -rs
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-figures
          path: smoke/figures/

  docker:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t intrinsic-it-relu-nets .
      - name: step 5 inside the image, without network
        run: |
          mkdir -p figures-docker
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/figures-docker:/app/figures" intrinsic-it-relu-nets step5
          test "$(ls figures-docker/*.pdf | wc -l)" -eq 10
