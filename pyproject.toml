[project]
name = "intrinsic-it-relu-nets"
version = "0.1.0"
description = "Code for \"Intrinsic Information Theoretic Analysis of ReLU Nets\" (NeurIPS 2026)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "threadpoolctl>=3.6",
    # Pinned: the networks were verified to retrain bit-identically with these.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.67",
    "ucimlrepo>=0.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "parx[h5]>=0.1.3,<0.2",
]
# Rebuttal Exp 10 (extra bias corrections). infomeasure is AGPL-3.0, so it is
# kept out of the default install: uv sync --group rebuttal
rebuttal = [
    "infomeasure==0.6.2",  # version used for the rebuttal numbers,
]

# CPU-only PyTorch: nothing here uses a GPU, and the CPU build trains the
# networks bit-identically to the CUDA build at ~1/4 of the install size.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
